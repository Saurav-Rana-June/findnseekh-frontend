<div
  class="dropdown-wrapper"
  [class.is-field]="variant() === 'field'"
  [class.is-full-width]="fullWidth()"
  (focusout)="onFocusOut($event)"
>
  @if (label()) {
    <label class="dropdown-label" [attr.for]="dropdownId">
      {{ label() }}
      @if (required()) {
        <span class="dropdown-required" aria-hidden="true">*</span>
      }
    </label>
  }

  <div class="dropdown-container" [class.is-full-width]="fullWidth() || variant() === 'field'">
    <button
      type="button"
      class="dropdown-trigger"
      [attr.id]="dropdownId"
      [attr.aria-haspopup]="'listbox'"
      [attr.aria-expanded]="isOpen()"
      [attr.aria-controls]="listId"
      [attr.aria-label]="ariaLabel() || label() || displayLabel()"
      [attr.data-size]="size()"
      [attr.data-variant]="variant()"
      [class.is-open]="isOpen()"
      [class.is-disabled]="disabled()"
      [class.is-invalid]="invalid()"
      [class.is-full-width]="fullWidth() || variant() === 'field'"
      [disabled]="disabled()"
      (click)="toggleOpen()"
    >
      <span class="dropdown-trigger__label" [class.is-placeholder]="isPlaceholder()">
        {{ displayLabel() }}
      </span>
      <svg
        class="dropdown-trigger__chevron"
        [class.is-rotated]="isOpen()"
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <polyline points="6 9 12 15 18 9" />
      </svg>
    </button>

    @if (isOpen()) {
      <ul
        [id]="listId"
        class="dropdown-menu"
        [attr.data-align]="align()"
        [attr.data-match-trigger]="shouldMatchTriggerWidth()"
        [style.min-width]="shouldMatchTriggerWidth() ? '100%' : minWidth()"
        [style.width]="shouldMatchTriggerWidth() ? '100%' : null"
        role="listbox"
        [attr.aria-labelledby]="dropdownId"
      >
        @for (opt of options(); track opt.value) {
          <li
            role="option"
            [attr.aria-selected]="opt.value === value()"
            class="dropdown-option"
            [class.is-selected]="opt.value === value()"
            (click)="selectOption(opt)"
          >
            <div class="dropdown-option__left">
              @if (opt.value === value()) {
                <svg
                  class="dropdown-option__check"
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <polyline points="20 6 9 17 4 12" />
                </svg>
              }
              <span class="dropdown-option__value">{{ opt.label }}</span>
            </div>

            @if (opt.hint) {
              <span class="dropdown-option__hint">{{ opt.hint }}</span>
            }
          </li>
        }
      </ul>
    }
  </div>

  @if (errorMessage()) {
    <p class="dropdown-error">{{ errorMessage() }}</p>
  }
</div>
