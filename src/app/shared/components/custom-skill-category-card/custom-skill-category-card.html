<button
  type="button"
  class="skill-cat-card"
  [attr.aria-label]="'Explore ' + category().title"
  (click)="onClick()"
>
  <span class="skill-cat-card__art" aria-hidden="true">
    <span class="skill-cat-card__ring skill-cat-card__ring--a"></span>
    <span class="skill-cat-card__ring skill-cat-card__ring--b"></span>
    <span class="skill-cat-card__icon">
      <img
        class="skill-cat-card__glyph"
        [src]="iconSrc()"
        alt=""
        width="34"
        height="34"
      />
    </span>
  </span>

  <span class="skill-cat-card__body">
    <span class="skill-cat-card__name">{{ category().title }}</span>
    <span class="skill-cat-card__desc">{{ category().description }}</span>
  </span>
</button>
