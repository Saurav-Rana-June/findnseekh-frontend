<header class="page-header">
  <div class="page-header__content">
    <h1 class="page-header__title" [id]="headingId() || null">{{ title() }}</h1>
    @if (subtitle()) {
      <p class="page-header__subtitle">{{ subtitle() }}</p>
    }
  </div>
  <div class="page-header__actions">
    <ng-content />
  </div>
</header>
