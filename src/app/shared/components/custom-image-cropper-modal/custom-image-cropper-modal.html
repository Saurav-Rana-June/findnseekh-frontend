<app-custom-modal
  [open]="open()"
  [title]="title()"
  subtitle="Drag to reposition and use the slider to zoom in. The final image will be cropped to a 1:1 circle."
  maxWidth="28rem"
  closeLabel="Cancel cropping"
  (closed)="close()"
>
  <div class="cropper-container">
    <div
      class="cropper-viewport"
      [class.is-dragging]="isDragging()"
      (mousedown)="onMouseDown($event)"
      (mousemove)="onMouseMove($event)"
      (mouseup)="onMouseUp()"
      (mouseleave)="onMouseUp()"
      (touchstart)="onTouchStart($event)"
      (touchmove)="onTouchMove($event)"
      (touchend)="onTouchEnd()"
    >
      <canvas
        #cropCanvas
        class="cropper-canvas"
        width="280"
        height="280"
      ></canvas>

      <!-- Circular visual crop guide overlay -->
      <div class="cropper-guide-overlay" aria-hidden="true"></div>
    </div>

    <!-- Zoom Control Slider -->
    <div class="cropper-controls">
      <svg class="zoom-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
        <line x1="8" y1="11" x2="14" y2="11" />
      </svg>
      <input
        type="range"
        class="zoom-slider"
        min="1"
        max="3"
        step="0.05"
        [value]="zoom()"
        aria-label="Image zoom"
        (input)="onZoomChange($event)"
      />
      <svg class="zoom-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
        <line x1="11" y1="8" x2="11" y2="14" />
        <line x1="8" y1="11" x2="14" y2="11" />
      </svg>
    </div>

    <!-- Actions -->
    <div class="cropper-actions">
      <app-custom-primary-button
        variant="outline"
        size="md"
        label="Cancel"
        (clicked)="close()"
      />
      <app-custom-primary-button
        variant="primary"
        size="md"
        label="Save Photo"
        (clicked)="onApplyCrop()"
      />
    </div>
  </div>
</app-custom-modal>
