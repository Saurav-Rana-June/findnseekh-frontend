<header class="navbar" [class.navbar--raised]="isScrolled() || isMobileMenuOpen()">
  <div class="page-container navbar__inner">
    <a class="brand" routerLink="/" aria-label="FindnSeekh – home" (click)="closeMobileMenu()">
      <svg class="brand__icon" viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <path d="M14 5L3 10.5L14 16L25 10.5L14 5Z" fill="currentColor" />
        <path d="M7 13.5V19.2C7 20.6 10.1 22.5 14 22.5C17.9 22.5 21 20.6 21 19.2V13.5L14 17L7 13.5Z" fill="currentColor"
          opacity="0.85" />
        <path d="M24 11.5V17.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
      <span>FindnSeekh</span>
    </a>

    <nav class="navbar__links" aria-label="Primary">
      @for (item of navItems; track item.label) {
      @if (item.fragment) {
      <a class="navbar__link" [href]="'#' + item.fragment" [class.is-active]="isItemActive(item)"
        [attr.aria-current]="isItemActive(item) ? 'page' : null">
        {{ item.label }}
      </a>
      } @else {
      <a class="navbar__link" routerLink="/" [class.is-active]="isItemActive(item)"
        [attr.aria-current]="isItemActive(item) ? 'page' : null">
        {{ item.label }}
      </a>
      }
      }
    </nav>

    <div class="navbar__actions">
      <a routerLink="/auth/login" class="btn btn--ghost">Log In</a>
      <a routerLink="/auth/login" class="btn btn--primary">Sign Up</a>
    </div>

    <button type="button" class="navbar__toggle" [attr.aria-label]="isMobileMenuOpen() ? 'Close menu' : 'Open menu'"
      [attr.aria-expanded]="isMobileMenuOpen()" aria-controls="mobile-menu" (click)="toggleMobileMenu()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        aria-hidden="true">
        @if (isMobileMenuOpen()) {
        <path d="M6 6L18 18M18 6L6 18" stroke-linecap="round" />
        } @else {
        <path d="M4 7H20M4 12H20M4 17H20" stroke-linecap="round" />
        }
      </svg>
    </button>
  </div>

  <div id="mobile-menu" class="navbar__mobile" [hidden]="!isMobileMenuOpen()">
    <nav class="page-container navbar__mobile-inner" aria-label="Mobile">
      @for (item of navItems; track item.label) {
      @if (item.fragment) {
      <a class="navbar__mobile-link" [href]="'#' + item.fragment" [class.is-active]="isItemActive(item)"
        (click)="closeMobileMenu()">
        {{ item.label }}
      </a>
      } @else {
      <a class="navbar__mobile-link" routerLink="/" [class.is-active]="isItemActive(item)" (click)="closeMobileMenu()">
        {{ item.label }}
      </a>
      }
      }
      <div class="navbar__mobile-actions">
        <a routerLink="/auth/login" class="btn btn--outline" (click)="closeMobileMenu()">Log In</a>
        <a routerLink="/auth/login" class="btn btn--primary" (click)="closeMobileMenu()">Sign Up</a>
      </div>
    </nav>
  </div>
</header>
