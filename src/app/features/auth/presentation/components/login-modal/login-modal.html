<app-custom-modal [open]="open()" title="Welcome back" subtitle="Log in with your email address and password."
  closeLabel="Close login dialog" (closed)="close()">
  <form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    @if (authStore.error(); as errorMessage) {
    <div class="login-form__alert" role="alert">
      {{ errorMessage }}
    </div>
    }

    <app-custom-textfield fieldId="login-email" label="Email Address" type="email" formControlName="email"
      autocomplete="email" placeholder="you@example.com" leadingIcon="mail" [autofocus]="open()"
      [invalid]="form.controls.email.invalid && form.controls.email.touched" [errorMessage]="emailError" />

    <app-password-field
      fieldId="login-password"
      label="Password"
      formControlName="password"
      autocomplete="current-password"
      placeholder="Enter your password"
      [invalid]="form.controls.password.invalid && form.controls.password.touched"
      [errorMessage]="passwordError"
    />

    <app-custom-primary-button class="login-form__submit" type="submit" variant="primary" size="lg" [fullWidth]="true"
      [loading]="authStore.isLoading()" [label]="authStore.isLoading() ? 'Logging in...' : 'Log In'" />

    <div class="login-modal__footer">
      <span>Don't have an account?</span>
      <button type="button" class="login-modal__link-btn" (click)="switchToRegister()">
        Register
      </button>
    </div>
  </form>
</app-custom-modal>
