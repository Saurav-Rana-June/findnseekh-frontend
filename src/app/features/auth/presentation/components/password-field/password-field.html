<app-custom-textfield [fieldId]="fieldId()" [label]="label()" [type]="showPassword() ? 'text' : 'password'"
  [value]="value()" [disabled]="disabled()" [autocomplete]="autocomplete()" [placeholder]="placeholder()"
  leadingIcon="lock" [required]="required()" [autofocus]="autofocus()" [invalid]="invalid()"
  [errorMessage]="errorMessage()" (valueChange)="handleValueChange($event)" (blurred)="handleBlur()">
  <app-custom-primary-button textfield-trailing variant="ghost" shape="rounded" minHeight="28px" paddingInline="4px"
    borderColor="transparent" textColor="var(--color-muted)" hoverBgColor="transparent"
    hoverTextColor="var(--color-primary)" [ariaLabel]="showPassword() ? 'Hide password' : 'Show password'"
    (clicked)="toggleVisibility()">
    @if (showPassword()) {
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      aria-hidden="true">
      <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49" />
      <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242" />
      <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143" />
      <path d="m2 2 20 20" />
    </svg>
    } @else {
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      aria-hidden="true">
      <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
      <circle cx="12" cy="12" r="3" />
    </svg>
    }
  </app-custom-primary-button>
</app-custom-textfield>
