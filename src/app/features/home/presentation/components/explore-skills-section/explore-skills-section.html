<section id="explore-skills" class="skills-section">
  <div class="page-container">
    <div class="section-header section-header--centered">
      <h2>Explore Skills That Inspire You</h2>
      <p>
        Discover something new and learn from people who are passionate about what they teach.
      </p>
    </div>

    <div class="skills-grid">
      @for (category of categories(); track category.id) {
        <button
          type="button"
          class="skill-card"
          (click)="categorySelected.emit(category)"
        >
          <div class="skill-card__media" aria-hidden="true">
            <span class="skill-card__arc skill-card__arc--tl"></span>
            <span class="skill-card__arc skill-card__arc--br"></span>
            <div class="skill-card__icon-box">
              @switch (category.id) {
                @case ('music') {
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <path d="M9 18V6L19 4V16" stroke-linecap="round" stroke-linejoin="round" />
                    <circle cx="6.5" cy="18" r="2.5" />
                    <circle cx="16.5" cy="16" r="2.5" />
                  </svg>
                }
                @case ('dance') {
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <circle cx="12" cy="5.5" r="2" />
                    <path d="M7 10.5L12 9L17 10.5M12 9V14.5M9 19L12 14.5L15 19" stroke-linecap="round" />
                  </svg>
                }
                @case ('photography') {
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <path d="M4 8.5A2 2 0 0 1 6 6.5H8.5L10 4.5H14L15.5 6.5H18A2 2 0 0 1 20 8.5V17.5A2 2 0 0 1 18 19.5H6A2 2 0 0 1 4 17.5V8.5Z" />
                    <circle cx="12" cy="13" r="3.2" />
                  </svg>
                }
                @case ('art-craft') {
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <path d="M12 4A8 8 0 0 0 4 12C4 16.4 7.6 20 12 20C13.1 20 14 19.1 14 18C14 17.5 13.8 17 13.5 16.6C13.2 16.3 13 15.8 13 15.3C13 14.2 13.9 13.3 15 13.3H16.8C18.6 13.3 20 11.9 20 10.1C20 6.7 16.4 4 12 4Z" />
                    <circle cx="8.5" cy="11" r="1" fill="currentColor" />
                    <circle cx="11.5" cy="8.5" r="1" fill="currentColor" />
                    <circle cx="15" cy="9.5" r="1" fill="currentColor" />
                  </svg>
                }
                @case ('fitness-yoga') {
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <path d="M14.5 5.5L18.5 9.5M5.5 14.5L9.5 18.5M16 4L20 8M4 16L8 20M9 15L15 9" stroke-linecap="round" />
                    <path d="M12.5 6.5L17.5 11.5M6.5 12.5L11.5 17.5" stroke-linecap="round" />
                  </svg>
                }
                @case ('cooking') {
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <path d="M7 13.5C5.3 13.2 4 11.7 4 9.9C4 7.9 5.6 6.3 7.6 6.3C8.2 4.9 9.9 4 12 4C14.1 4 15.8 4.9 16.4 6.3C18.4 6.3 20 7.9 20 9.9C20 11.7 18.7 13.2 17 13.5V19H7V13.5Z" stroke-linejoin="round" />
                    <path d="M7 16.5H17" />
                  </svg>
                }
                @case ('technology') {
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <path d="M8 9L4 12L8 15M16 9L20 12L16 15M13.5 7L10.5 17" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                }
                @case ('languages') {
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <path d="M4 6H12M8 4V6M6 6C6 9.5 8.5 12.5 11.5 13.5M10.5 6C9.8 9.2 7.5 12 4.5 13.5" stroke-linecap="round" />
                    <path d="M13 19L16.5 10L20 19M14.2 16H18.8" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                }
              }
            </div>
          </div>

          <div class="skill-card__body">
            <div class="skill-card__title-row">
              <h3>{{ category.title }}</h3>
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                <path d="M5 11L11 5M6.5 5H11V9.5" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </div>
            <p>{{ category.description }}</p>
          </div>
        </button>
      }
    </div>
  </div>
</section>
