<section id="how-it-works" class="section section--white" aria-labelledby="how-title">
  <div class="page-container">
    <div class="section-head section-head--center">
      <h2 id="how-title" class="section-title">How FindnSeekh Works</h2>
      <p class="section-lead">Three simple steps from curiosity to your first lesson.</p>
    </div>

    <ol class="steps">
      @for (step of steps(); track step.stepNumber; let last = $last) {
        <li>
          <app-custom-how-it-works-step-tile [step]="step" [showConnector]="!last" />
        </li>
      }
    </ol>
  </div>
</section>
