<section id="how-it-works" class="section section--how-it-works" aria-labelledby="how-title">
  <div class="page-container">
    <div class="section-head section-head--center">
      <span class="eyebrow">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10" />
          <path d="m10 15 5-3-5-3v6Z" />
        </svg>
        Simple Process
      </span>
      <h2 id="how-title" class="section-title">How FindnSeekh Works</h2>
      <p class="section-lead">Three simple steps from curiosity to your first lesson.</p>
    </div>

    <div class="how-it-works__surface">
      <ol class="steps">
        @for (step of steps(); track step.stepNumber; let last = $last) {
          <li class="steps__item">
            <app-custom-how-it-works-step-tile [step]="step" [showConnector]="!last" />
          </li>
        }
      </ol>
    </div>
  </div>
</section>
