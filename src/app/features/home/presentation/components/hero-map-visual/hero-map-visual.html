<app-repaint-boundary class="hero-art" aria-hidden="true">
  <app-repaint-boundary class="hero-art__panel" [clip]="true">
    <svg class="hero-art__map" viewBox="0 0 480 540" preserveAspectRatio="xMidYMid slice">
      <g fill="none" stroke="#F8F8F2" stroke-opacity=".16" stroke-width="14" stroke-linecap="round">
        <path d="M-20 140C90 120 150 210 260 190S420 120 520 170" />
        <path d="M60 -20C80 120 40 240 120 340S130 520 150 570" />
        <path d="M330 -20C300 110 380 220 340 330S420 470 400 570" />
        <path d="M-20 420C120 400 220 470 330 440S450 400 520 430" />
      </g>
      <g fill="#F8F8F2" fill-opacity=".06">
        <rect x="170" y="230" width="110" height="80" rx="18" />
        <rect x="20" y="40" width="90" height="70" rx="18" />
        <rect x="360" y="260" width="90" height="110" rx="18" />
        <rect x="190" y="470" width="120" height="60" rx="18" />
      </g>
      <circle cx="240" cy="290" r="150" fill="none" stroke="#F8F8F2" stroke-opacity=".22" stroke-dasharray="3 9"
        stroke-width="2" />
      <circle cx="240" cy="290" r="92" fill="none" stroke="#F8F8F2" stroke-opacity=".28" stroke-dasharray="3 9"
        stroke-width="2" />
    </svg>

    <app-repaint-boundary class="hero-art__learner">
      <span class="hero-art__pulse"></span>
      <span class="hero-art__learner-dot">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
          <path d="M6 12v5c3 3 9 3 12 0v-5" />
        </svg>
      </span>
    </app-repaint-boundary>

    <div class="hero-art__pin hero-art__pin--a">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="m11.9 12.1 4.5-4.5" />
        <path d="m20 7-3-3-1.5 1.5 3 3Z" />
        <path
          d="M13.4 13.4a4 4 0 1 1-5.6-5.6c1.6-1.6 3.7-1.4 5.2-.1.5.4 1.3.4 1.8-.1l.7-.7c1 1 1.4 2.5.8 3.9-.4.9-.3 2 .4 2.7l.7.7a2.8 2.8 0 0 1-4 4l-.7-.7c-.7-.7-1.8-.8-2.7-.4-1.4.6-2.9.2-3.9-.8" />
      </svg>
    </div>

    <div class="hero-art__pin hero-art__pin--b">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="5" r="1" />
        <path d="m9 20 3-6 3 6" />
        <path d="m6 8 6 2 6-2" />
        <path d="M12 10v4" />
      </svg>
    </div>

    <div class="hero-art__pin hero-art__pin--c">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
        <circle cx="12" cy="10" r="3" />
      </svg>
    </div>
  </app-repaint-boundary>

  @if (vocalAvatar(); as vocal) {
  <app-repaint-boundary class="hero-art__card hero-art__card--top">
    <div class="hero-art__avatar">
      <app-teacher-avatar [spec]="vocal" />
    </div>
    <div>
      <strong>Vocals &amp; Music</strong>
      <span>Near you</span>
    </div>
  </app-repaint-boundary>
  }

  @if (dancerAvatar(); as dancer) {
  <app-repaint-boundary class="hero-art__card hero-art__card--mid">
    <div class="hero-art__avatar">
      <app-teacher-avatar [spec]="dancer" />
    </div>
    <div>
      <strong>Kathak &amp; Dance</strong>
      <span>Near you</span>
    </div>
  </app-repaint-boundary>
  }

  @if (yogiAvatar(); as yogi) {
  <app-repaint-boundary class="hero-art__card hero-art__card--bottom">
    <div class="hero-art__avatar">
      <app-teacher-avatar [spec]="yogi" />
    </div>
    <div>
      <strong>Yoga &amp; Wellness</strong>
      <span>Near you</span>
    </div>
  </app-repaint-boundary>
  }
</app-repaint-boundary>
