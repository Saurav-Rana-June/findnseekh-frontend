<app-home-hero
  [popularSkills]="store.popularSkills()"
  [locationOptions]="store.locationOptions()"
  [skillOptions]="store.skillOptions()"
  [heroAvatars]="store.heroAvatars()"
  [initialQuery]="store.searchQuery()"
  (searchSubmitted)="onSearchSubmitted($event)"
  (popularSkillSelected)="onPopularSkillSelected($event)"
/>

<app-explore-skills-section
  [categories]="store.categories()"
  (categorySelected)="onCategorySelected($event)"
/>

<app-featured-teachers-section
  [teachers]="store.featuredTeachers()"
  [hasActiveFilter]="hasActiveFilter()"
  (browseAllClicked)="onBrowseAllClicked()"
  (viewProfileClicked)="onViewProfileClicked($event)"
/>

<app-how-it-works-section [steps]="store.steps()" />

@if (!authStore.isTeacher()) {
  <app-become-teacher-cta />
}
